[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexrgba"
version = "0.2.1"
description = "CSS hex and named colors: parse, normalize, exact alpha, rgba(), WCAG contrast and blending"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "hex", "color", "css", "rgba", "parse", "normalize", "named-colors", "wcag", "contrast", "blend",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
hexrgba = "hexrgba._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/hexrgba"
Issues = "https://github.com/JaviLianes8/hexrgba/issues"
Changelog = "https://github.com/JaviLianes8/hexrgba/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party test files are fetched locally and never shipped; only their manifest is.
include = [
    "src/hexrgba",
    "tests/*.py",
    "tests/fixtures/css-color-4-named-colors.json",
    "tests/upstream/MANIFEST.json",
    "scripts/fetch_upstream.py",
    "scripts/e2e_wheel.py",
    "CHANGELOG.md",
    "GUIDE.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hexrgba"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
